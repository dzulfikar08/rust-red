name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            arch_name: x86_64
            runner: ubuntu-latest
          - os_name: linux
            arch_name: aarch64
            runner: ubuntu-24.04-arm
          - os_name: macos
            arch_name: aarch64
            runner: macos-latest
          - os_name: macos
            arch_name: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js (builds the Node-RED editor)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os_name }}-${{ matrix.arch_name }}
          cache-on-failure: true

      # Default feature set. See README "Release builds".
      - name: Build release binary
        run: cargo build --release

      # build.rs only warns when the editor build fails, so make a release without editor impossible.
      - name: Check the Node-RED editor files were built
        shell: bash
        run: test -f target/ui_static/red/red.min.js || { echo "Node-RED editor files are missing"; exit 1; }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rust-red-${version}-${{ matrix.os_name }}-${{ matrix.arch_name }}"
          mkdir -p "dist/${name}"
          cp target/release/rust-red "dist/${name}/"
          cp -R target/ui_static "dist/${name}/ui_static"
          cp LICENSE NOTICE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          ls -l "${name}.tar.gz"
          ls -l "${name}/rust-red"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-red-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-output
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd release-output
          cat *.sha256 > checksums-sha256.txt
          cat checksums-sha256.txt
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RustRED ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-output/*
          body: |
            RustRED is a fork of [EdgeLinkd](https://github.com/oldrev/edgelinkd) by Li Wei (Apache-2.0).

            Each archive contains the `rust-red` binary (default feature set), the Node-RED editor files in `ui_static/` (the editor is served from the directory next to the binary), LICENSE and NOTICE.

            Run: `tar xzf rust-red-*.tar.gz && cd rust-red-*/ && ./rust-red run flows.json`, then open http://127.0.0.1:1888.

            Verify integrity with `sha256sum -c checksums-sha256.txt --ignore-missing`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
