# GitGuardian (ggshield) config. The paths below hold made-up test credentials: Node-RED credential
# fixtures generated by a throwaway Node-RED instance and the Docker smoke test that starts disposable
# Mosquitto and PostgreSQL containers with throwaway passwords. No real secret lives in this repository.
version: 2
secret:
  ignored_paths:
    - "crates/core/tests/fixtures/node_red_credentials/**"
    - "crates/core/tests/nodered_compat/test_credentials.rs"
    - "crates/core/src/runtime/credentials.rs"
    - "crates/web/src/**/tests.rs"
    - "scripts/smoke/**"
    - "rust-red.toml.example"
